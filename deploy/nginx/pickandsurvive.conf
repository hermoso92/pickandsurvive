# Copiar a /etc/nginx/sites-available/ y enlazar en sites-enabled.
# Reemplazar app.tudominio.com y api.tudominio.com.
# Tras editar: sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d app.tudominio.com -d api.tudominio.com

upstream pickandsurvive_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream pickandsurvive_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.tudominio.com;

    location / {
        proxy_pass http://pickandsurvive_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tudominio.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://pickandsurvive_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
